name: Build and Deploy

on:
  push:
    branches:
      - dev
      - develop
      - main
  pull_request:
    branches:
      - dev
      - main

# 取消正在运行的相同工作流
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== 代码检查和测试 ====================
  lint-and-test:
    name: 🔍 Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ✅ 添加超时限制

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm run lint
        continue-on-error: false

      - name: 🧪 Run tests
        run: pnpm run test || echo "⚠️ No tests configured"
        continue-on-error: true

      - name: 📊 Type check
        run: pnpm run type-check || echo "⚠️ No type check configured"
        continue-on-error: true

  # ==================== 构建应用 ====================
  build:
    name: 🏗️ Build Application
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm store prune  # ✅ 清理缓存

      - name: 🏗️ Build for production
        run: pnpm run build:prod || pnpm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 9  # ✅ 最大压缩

      - name: 📊 Build summary
        run: |
          echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build size:** $(du -sh dist/ | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files count:** $(find dist/ -type f | wc -l)" >> $GITHUB_STEP_SUMMARY

  # ==================== 部署到服务器 ====================
  deploy:
    name: 🚀 Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ✅ 添加 secrets 检查
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      secrets.SERVER_HOST != ''

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: 🚀 Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_PATH || '/var/www/html' }}
          strip_components: 1
          overwrite: true
          timeout: 5m  # ✅ 添加超时

      - name: 🔄 Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s  # ✅ 添加超时
          script: |
            echo "🔄 Restarting Nginx..."
            
            # 测试配置
            sudo nginx -t
            
            # 重载服务
            sudo systemctl reload nginx || sudo systemctl restart nginx
            
            # 等待启动
            sleep 2
            
            # 健康检查
            if curl -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ Nginx restarted successfully"
            else
              echo "⚠️ Health check failed"
              exit 1
            fi
            
            # 清理旧备份
            cd ${{ secrets.DEPLOY_PATH || '/var/www/html' }}
            find . -name "backup-*" -mtime +7 -delete || true

      - name: 📊 Deployment summary
        run: |
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy path:** ${{ secrets.DEPLOY_PATH || '/var/www/html' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  # ==================== 构建 Docker 镜像 ====================
  build-docker:
    name: 🐳 Build Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ✅ 添加 secrets 检查
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      secrets.DOCKER_USERNAME != ''

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zq-admin
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=20
            PNPM_VERSION=8
          # ✅ 添加平台支持
          platforms: linux/amd64,linux/arm64

      - name: 📊 Docker build summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  # ==================== 通知 ====================
  notify:
    name: 📢 Notify
    needs: [deploy, build-docker]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📊 Generate summary
        run: |
          echo "### 📊 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          DEPLOY="${{ needs.deploy.result }}"
          DOCKER="${{ needs.build-docker.result }}"
          
          if [ "$DEPLOY" == "success" ] || [ "$DOCKER" == "success" ]; then
            echo "✅ **Overall Status:** Success" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEPLOY" == "skipped" ] && [ "$DOCKER" == "skipped" ]; then
            echo "⏭️ **Overall Status:** Skipped (no deployment needed)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Overall Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
